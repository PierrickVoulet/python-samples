[project]
name = "enterprise-ai"
version = "0.1.0"
description = "The Enterprise AI agent."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Pierrick Voulet" }
]
dependencies = [
    "google-adk (>=1.28.1,<2.0.0)",
    "google-api-core>=2.29.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.126.1",
    "google-genai>=1.9.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.2",
    "requests (>=2.32.0,<3.0.0)",
]

[tool.poetry.group.dev.dependencies]
google-adk = { version = ">=1.28.1", extras = ["eval"] }
litellm = ">=1.84.0"

[tool.poetry.group.deployment.dependencies]
absl-py = ">=2.2.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
